name: smoke-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: |
          python3 -m py_compile \
            skills/codex-recon/scripts/recon.py \
            skills/codex-fanout/scripts/fanout.py \
            skills/codex-triage/scripts/triage.py
      - name: Check shell script syntax
        run: |
          bash -n \
            skills/codex-recon/scripts/test_smoke.sh \
            skills/codex-fanout/scripts/test_smoke.sh \
            skills/codex-triage/scripts/test_smoke.sh
      - name: Run all skill smoke tests (stubbed codex, no tokens)
        run: |
          set -e
          for s in codex-recon codex-fanout codex-triage; do
            echo "::group::$s"
            bash "skills/$s/scripts/test_smoke.sh"
            echo "::endgroup::"
          done
